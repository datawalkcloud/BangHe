version: '1.0'
name: gitee-publish
displayName: Gitee 发布（下载镜像 + 发行版）

# 这条流水线只负责「把最新一次 GitHub Release 搬到 Gitee」，构建仍在 GitHub
# （Gitee Go 云端没有 Windows runner，跑不了 Tauri + NSIS）。
# 落点两个仓：banghe-release（raw 只留 latest.json 兜底 + 按版本翻的发行版）、
# BangHe（源码镜像，项目首页「发行版」区也建一份）。安装包与更新清单都挂发行版附件：
# 客户端 endpoints 首位读 releases/download/latest/latest.json，从发行版附件下载安装包。
#
# 触发方式只有两种，故意不配 triggers：
#   1) GitHub 发完 Release 后经 go-api 触发
#      （scripts/release-notes/trigger_gitee_pipeline.py）；
#   2) 在 Gitee Go 页面手动执行（补发/重跑）。
# 千万别加 push 触发：Gitee 镜像仓每次从 GitHub 同步源码都会推 master，
# 加了就是每同步一次跑一遍发布。
#
# 一次性配置（都在 Gitee 侧，不进仓库）：
#   Gitee Go → 通用变量：BH_GITEE_TOKEN（私人令牌，勾 projects 权限，要能推
#   datawalkcloud/banghe-release 与调 v5 发行版接口）。名字不能用 GITEE_ 开头——
#   那是系统级参数保留前缀。可选 BH_GITEE_USER（私人令牌所属账号的登录名；
#   不配则用令牌调 /api/v5/user 反查）。
# 建完变量必须在流水线里「引用」：YAML 的 variables.global 列表写上变量名
# （可视化界面的「编辑流水线 → 变量设置 → 引用变量」保存后写的就是这个）。
# 没被引用的通用变量不会进构建环境（实测：env 里没有、${} 也不替换）。
#   其余缺省值写死在 scripts/release-notes/gitee_publish.py 里。
#
# 脚本自举（见下面最后一条命令）：发布脚本一律从 GitHub master 现取现跑，不用先把改动
# 同步到 Gitee 镜像仓。这条流水线自己（本文件的 commands）才是唯一需要同步的部分。
variables:
  BH_PROBE: probe-value
  global:
    - BH_GITEE_TOKEN
    - BH_GITEE_USER
stages:
  - stage:
    name: publish
    displayName: 同步最新 Release 到 Gitee
    strategy: naturally
    trigger: auto
    steps:
      - step: build@python
        name: publish_gitee
        displayName: 推下载镜像 + 建发行版
        # CentOS 8.3 基础镜像，自带 git；脚本只用标准库，不需要 pip
        pythonVersion: 3.9
        commands:
          - python3 -V
          # 只打印长度不打印值：检测 ${} 替换与检出凭据可用性（gitee_probe.py）
          - set +x; T='${BH_GITEE_TOKEN}'; P='${BH_PROBE}'; echo "subst token_len=${#T} probe_len=${#P}"; python3 scripts/release-notes/gitee_probe.py
          # set +x 先关回显，免得令牌以明文出现在公开的构建日志里。
          # 自举：Gitee Go 检出的是 Gitee 镜像仓，而镜像「同步」要人手点，滞后时跑的就是
          # 上一版脚本——构建 #11 为此判红（002f71e 没同步过去，raw 推成旧版式、发行版
          # 没挂 latest.json）。所以先浅取 GitHub master 的 scripts/ 再跑那份；GitHub 取不到
          # 才退回检出仓，网络抖动不该让本来已经能成的发布变红。日志里的两个 SHA 就是
          # 本次实际跑的脚本版本。GH_REPO 要与 gitee_publish.py 的缺省值保持一致。
          # 不 cd 进 $BOOT：cwd 留在检出仓，gitee_publish.py 万一拿不到通用变量时还能沿用
          # 构建机注入的检出凭据（http.extraheader 是仓级配置）。
          - >-
            set +x; echo "流水线检出（Gitee 镜像仓）@ $(git rev-parse --short HEAD 2>/dev/null)";
            BOOT=$(mktemp -d); GH_REPO=datawalkcloud/BangHe; export GH_REPO;
            if git init -q "$BOOT" && git -C "$BOOT" remote add origin "https://github.com/$GH_REPO.git"
            && git -C "$BOOT" -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=20
            fetch -q --depth=1 --no-tags origin master
            && git -C "$BOOT" checkout -q FETCH_HEAD -- scripts; then
            echo "发布脚本取自 GitHub master @ $(git -C "$BOOT" rev-parse --short FETCH_HEAD)";
            SRC="$BOOT"; else echo "取 GitHub 脚本失败，改用检出仓那份"; SRC="$(pwd)"; fi;
            python3 "$SRC/scripts/release-notes/gitee_publish.py"; rc=$?;
            rm -rf "$BOOT" 2>/dev/null; exit $rc
        notify: []
        strategy:
          retry: '0'