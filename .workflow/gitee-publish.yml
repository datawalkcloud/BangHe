version: '1.0'
name: gitee-publish
displayName: Gitee 发布（下载镜像 + 发行版）

# 这条流水线只负责「把最新一次 GitHub Release 搬到 Gitee」，构建仍在 GitHub
# （Gitee Go 云端没有 Windows runner，跑不了 Tauri + NSIS）。
# 落点两个仓：banghe-release（raw 下载镜像 + 按版本翻的发行版）、
# BangHe（源码镜像，项目首页「发行版」区也建一份）。
#
# 触发方式只有两种，故意不配 triggers：
#   1) GitHub 发完 Release 后经 go-api 触发
#      （scripts/release-notes/trigger_gitee_pipeline.py）；
#   2) 在 Gitee Go 页面手动执行（补发/重跑）。
# 千万别加 push 触发：Gitee 镜像仓每次从 GitHub 同步源码都会推 master，
# 加了就是每同步一次跑一遍发布。
#
# 一次性配置（都在 Gitee 侧，不进仓库）：
#   Gitee Go → 通用变量：BH_GITEE_TOKEN（私人令牌，勾 projects 权限，要能推
#   datawalkcloud/banghe-release 与调 v5 发行版接口）。名字不能用 GITEE_ 开头——
#   那是系统级参数保留前缀。可选 BH_GITEE_USER（私人令牌所属账号的登录名；
#   不配则用令牌调 /api/v5/user 反查）。
#   建完变量必须在「编辑流水线 → 变量设置 → 引用变量」里勾选它们并保存，
#   没被引用的通用变量不会进构建环境（实测：env 里没有、${} 也不替换）。
#   其余缺省值写死在 scripts/release-notes/gitee_publish.py 里。
variables:
  BH_PROBE: probe-value
stages:
  - stage:
    name: publish
    displayName: 同步最新 Release 到 Gitee
    strategy: naturally
    trigger: auto
    steps:
      - step: build@python
        name: publish_gitee
        displayName: 推下载镜像 + 建发行版
        # CentOS 8.3 基础镜像，自带 git；脚本只用标准库，不需要 pip
        pythonVersion: 3.9
        commands:
          - python3 -V
          # 只打印长度不打印值：检测 ${} 替换与检出凭据可用性（gitee_probe.py）
          - set +x; T='${BH_GITEE_TOKEN}'; P='${BH_PROBE}'; echo "subst token_len=${#T} probe_len=${#P}"; python3 scripts/release-notes/gitee_probe.py
          # set +x 先关回显，免得令牌以明文出现在公开的构建日志里
          - set +x; python3 scripts/release-notes/gitee_publish.py
        notify: []
        strategy:
          retry: '0'