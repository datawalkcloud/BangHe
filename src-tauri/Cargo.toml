[package]
name = "banghe"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "banghe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 小票机（斯普瑞特 SPRT 80mm）走 ESC/POS RAW：设备访问与票面排版都在 ticket-core，
# 与 tools/escpos-probe 共用同一份实现，避免"工装能打对、软件打错"这类无法归因的分叉
ticket-core = { path = "../crates/ticket-core" }
# 精伦(Routon) iDR 身份证 / Mifare IC 卡读卡器封装（零依赖，加载 32/64 位 Sdtapi.dll）。
# BangHe 是 64 位 Tauri 应用，加载 64 位版 Sdtapi.dll（见 resources/sdtapi/），in-process 直调。
routon-idr = "0.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.0"
thiserror = "2.0.20"
chrono = "0.4.45"
strum = { version = "0.28.0", features = ["derive"] }
argon2 = { version = "0.6.0", features = ["rand_core"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
regex = "1.13.1"
