[package]
name = "banghe"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "banghe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon`：主窗口可以被设成"关闭时藏进系统托盘"（系统 → 窗口），托盘是那条唯一的回路。
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# 备份页「从其它位置导入副本」要弹系统文件选择框去挑 U 盘/移动硬盘上的 .db。
# 插件只提供选路，路径清洗与落盘全在 system.rs::import_backup（只认绝对路径）。
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 小票机（斯普瑞特 SPRT 80mm）走 ESC/POS RAW：设备访问与票面排版都在 ticket-core，
# 与 tools/escpos-probe 共用同一份实现，避免"工装能打对、软件打错"这类无法归因的分叉
ticket-core = { path = "../crates/ticket-core" }
# 精伦(Routon) iDR 身份证 / Mifare IC 卡读卡器封装（零依赖，加载 32/64 位 Sdtapi.dll）。
# BangHe 是 64 位 Tauri 应用，加载 64 位版 Sdtapi.dll（见 resources/sdtapi/），in-process 直调。
routon-idr = "0.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.0"
thiserror = "2.0.20"
chrono = "0.4.45"
strum = { version = "0.28.0", features = ["derive"] }
argon2 = { version = "0.6.0", features = ["rand_core"] }
serialport = "4.10.1"
# 工作台「过磅画面」的第二条通道（camera_stream.rs）：Rust 拉 RTSP/TCP 子码流、软解 H.264、
# 一帧一张 JPEG 推给界面。为什么不走 WebView 播流：那要引 ffmpeg 或厂商 SDK，而这条路的
# 依赖只有下面这两个纯计算库，运行时不多带一个 exe/dll。
# openh264 的默认 `source` 特性会把 Cisco 的 C 源码编进来（所以**构建机需要 C 编译器**；
# 装了 nasm 会快很多，但不是必需），关掉它就连 `Decoder::new` 都不存在，因此按默认开。
openh264 = "0.9.8"
# 纯 Rust 压 JPEG，负责把解出来的 RGB 变成 `<img>` 能直接吃的 dataURL。
jpeg-encoder = "0.6.1"

# 添加设备表单要「自动扫描本机连接的打印机」：热敏直连小票机走 ticket-core 的 usbprint 枚举，
# A4 / 针式这类打印队列打印机则用系统 EnumPrintersW 按名字挑机。复用锁文件里 tauri 已带进来的
# windows 0.61，只在 Windows 目标下编译（代码里以 #[cfg(target_os = "windows")] 兜住非 Windows）。
# `Win32_Graphics_Dwm` 另给 titlebar.rs 用：Tauri 自带的 set_theme 在 Windows 上只设 WebView2 的
# preferred color scheme（wry 里就是一句 SetPreferredColorScheme），原生标题栏深浅必须自己调
# DwmSetWindowAttribute。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Graphics_Printing", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Storage_Xps", "Win32_Security", "Win32_Media_MediaFoundation", "Win32_System_Com"] }
# 队列直打（queue_print）要在 GDI 上画出票面二维码：纯 Rust、只取模块矩阵自己涂方块，
# 不引图像编解码。热敏侧不需要它（ESC/POS 打印机固件自带 QR 指令）。
qrcode = { version = "0.14", default-features = false }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# `unwind` 不是随手写的：camera_stream.rs 用 `catch_unwind` 把第三方解码库的 assert
# （`write_rgb8` 的尺寸/格式检查）圈在**那一格画面**里。`panic = "abort"` 下 catch_unwind
# 是空转——一次坏流就会把整个磅房程序带走，而 release 装机正是有坏流的那一侧。
# 代价是包体略大（Tauri 的体积指南估 5–10%），换的是"画面崩不拦称重"。
panic = "unwind"
strip = true

[dev-dependencies]
regex = "1.13.1"
