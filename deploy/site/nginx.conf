# 官网静态托管配置。整份替换官方镜像的 nginx.conf，不依赖 conf.d 默认站点。
# 容器以 USER nginx（非 root）运行，故 pid 与所有临时目录都改到 /tmp；
# k8s 侧给 /tmp 挂 emptyDir 即可配合 readOnlyRootFilesystem。

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;

    # 日志写 stdout/stderr，交给容器运行时收集
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    # 非 root 进程的可写临时目录
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # 首页 148KB 且样式内联，gzip 后体积差一个数量级
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # add_header 一旦出现在 location 里就会覆盖 server 级，故安全头只在此声明一次；
        # 下面的缓存策略用 expires 控制（它不影响 add_header 的继承）。
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # 默认不缓存 HTML：发版后刷新即可看到新内容
        expires -1;

        # k8s 探针端点，不写访问日志
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # 静态资源长缓存（官网资源少且稳定，30 天够用）
        location ~* \.(?:png|jpe?g|gif|ico|svg|webp|css|js|woff2?)$ {
            expires 30d;
            access_log off;
            try_files $uri =404;
        }

        # /brochure、/privacy、/terms 是目录内 index.html，nginx 自动处理尾斜杠跳转
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
